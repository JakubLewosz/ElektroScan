services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8010:8010"
    volumes:
      - backend-sessions:/app/data/sessions
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/health', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5174:5174"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-sessions:
